# Static web version (no Rust) on GitHub Pages: same codebase, the platform
# layer picks the File System Access API at runtime. Deploys a push to main once
# `ci` passed on it (the commit ci tested), or by hand.
name: pages

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pushes only: a pull request from a fork's `main` also matches `branches: [main]`.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Build
        run: |
          # https://<user>.github.io/<repo>/, or the root for a <user>.github.io repo
          REPO="${{ github.event.repository.name }}"
          case "$REPO" in *.github.io) export BASE_PATH="" ;; *) export BASE_PATH="/$REPO" ;; esac
          bun run build:web
      # The example library (built at /dev/starter, attached to the `starter`
      # release) is served next to the app: the desktop app downloads it from here.
      - name: Example library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download starter --repo "${{ github.repository }}" --pattern starter.zip --dir "$RUNNER_TEMP"; then
            unzip -q "$RUNNER_TEMP/starter.zip" -d build/starter
          else
            echo "No starter release yet: the example library is skipped."
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
