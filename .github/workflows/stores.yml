# The stores, from a published release: Chrome Web Store, winget and the AUR.
# Called by release.yml once a stable release is published; also run by hand
# (Actions › stores › Run workflow, with the tag) to retry one for a release
# without rebuilding it. Each store is a no-op until its secrets exist (see
# RELEASING.md), and a re-run of a version a store already has does nothing.
name: stores

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Published stable release, e.g. v0.5.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}

jobs:
  # A published, stable release: stores never get drafts or prereleases.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INFO=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)
          if [ "$(echo "$INFO" | jq -r '.isDraft or .isPrerelease')" = "true" ]; then
            echo "::error::$TAG is a draft or a prerelease: the stores only get published stable releases."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # Chrome Web Store API v2 (https://developer.chrome.com/docs/webstore/using-api).
  # The item must exist (first upload by hand), and each upload needs a higher
  # version: prereleases (0.4.0-rc.1 is 0.4.0 to Chrome) never go there.
  chrome-web-store:
    needs: prepare
    runs-on: ubuntu-latest
    # One store submission at a time, whatever the tag.
    concurrency:
      group: chrome-web-store
      cancel-in-progress: false
    env:
      CWS: ${{ secrets.CWS_CLIENT_ID != '' && secrets.CWS_CLIENT_SECRET != '' && secrets.CWS_REFRESH_TOKEN != '' && vars.CWS_PUBLISHER_ID != '' && vars.CWS_EXTENSION_ID != '' }}
    steps:
      - name: Not set up
        if: env.CWS != 'true'
        run: echo "::notice::Chrome Web Store publishing is not set up (see RELEASING.md), skipped."

      # From the published release: the store gets exactly what users download.
      - name: Upload and submit for review
        if: env.CWS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          ITEM: publishers/${{ vars.CWS_PUBLISHER_ID }}/items/${{ vars.CWS_EXTENSION_ID }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern '*_chrome.zip' --dir "$RUNNER_TEMP/zip"
          ZIP=$(find "$RUNNER_TEMP/zip" -name '*_chrome.zip' | head -1)
          OAUTH=$(curl -sS https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" -d grant_type=refresh_token)
          TOKEN=$(echo "$OAUTH" | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then
            # e.g. invalid_client (client ID or secret), invalid_grant (refresh token
            # revoked or expired: a consent screen still in "Testing" expires it in 7 days).
            REASON=$(echo "$OAUTH" | jq -r '[.error, .error_description] | map(select(.)) | join(": ")')
            echo "::error::Google sign-in failed: $REASON"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          API=https://chromewebstore.googleapis.com
          # Re-running a release whose version is already there: nothing to do.
          STATUS=$(curl -sS -H "Authorization: Bearer $TOKEN" "$API/v2/$ITEM:fetchStatus")
          echo "$STATUS" | jq .
          if echo "$STATUS" | jq -e .error >/dev/null; then
            echo "::error::Chrome Web Store: $(echo "$STATUS" | jq -r '.error.message')"
            exit 1
          fi
          if echo "$STATUS" | jq -e --arg v "$VERSION" '[.. | .crxVersion? // empty] | index($v)' >/dev/null; then
            echo "$VERSION is already in the Chrome Web Store."
            exit 0
          fi
          UPLOAD=$(curl -sS -H "Authorization: Bearer $TOKEN" -X POST -T "$ZIP" "$API/upload/v2/$ITEM:upload")
          echo "$UPLOAD" | jq .
          STATE=$(echo "$UPLOAD" | jq -r .uploadState)
          # Large packages are processed asynchronously.
          for _ in $(seq 30); do
            [ "$STATE" = "IN_PROGRESS" ] || break
            sleep 10
            STATE=$(curl -sSf -H "Authorization: Bearer $TOKEN" "$API/v2/$ITEM:fetchStatus" | jq -r '.lastAsyncUploadState // "IN_PROGRESS"')
          done
          if [ "$STATE" != "SUCCEEDED" ]; then
            echo "::error::Chrome Web Store upload: $STATE"
            exit 1
          fi
          curl -sSf -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -X POST "$API/v2/$ITEM:publish" -d '{"publishType":"DEFAULT_PUBLISH"}' | jq .

  # winget (microsoft/winget-pkgs), with Komac (github.com/russellbanks/Komac),
  # the tool behind the winget-releaser action, run directly: the NSIS setup
  # only, a pinned and checksummed binary, and a first submission it can't make.
  # Every version is a pull request that Microsoft's bots validate and a
  # moderator merges (usually within a day or two, longer for a new package).
  winget:
    needs: prepare
    runs-on: ubuntu-latest
    # One submission at a time, whatever the tag.
    concurrency:
      group: winget
      cancel-in-progress: false
    env:
      WINGET: ${{ secrets.WINGET_TOKEN != '' }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PACKAGE: JulienBlanchon.Xivly
      KOMAC_VERSION: 2.16.0
      KOMAC_SHA256: 7d2707fa6210f2789a3702de49fbd150b736dbf426ee0b9bc8e098736f9fd82d
    steps:
      - name: Not set up
        if: env.WINGET != 'true'
        run: echo "::notice::winget publishing is not set up (see RELEASING.md), skipped."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.WINGET == 'true'
        with:
          ref: ${{ env.TAG }}

      - name: Install Komac
        if: env.WINGET == 'true'
        run: |
          TGZ="komac-$KOMAC_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$TGZ" "https://github.com/russellbanks/Komac/releases/download/v$KOMAC_VERSION/$TGZ"
          echo "$KOMAC_SHA256  $RUNNER_TEMP/$TGZ" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$TGZ" -C "$RUNNER_TEMP" komac
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # From the published release: winget gets exactly what users download.
      # Komac branches from winget-pkgs' newest commit, which a fork that is
      # behind doesn't have yet ("failed to create branch").
      - name: Sync the winget-pkgs fork
        if: env.WINGET == 'true'
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          # The scopes the token has (classic PAT: public_repo and workflow needed).
          gh api -i user | grep -i '^x-oauth-scopes:' || echo "::warning::not a classic token (no scopes header)"
          OWNER=$(gh api user --jq .login)
          gh api -X POST "repos/$OWNER/winget-pkgs/merge-upstream" -f branch=master --jq .message

      - name: Submit to winget-pkgs
        if: env.WINGET == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Komac's token (classic PAT, public_repo + workflow): it pushes a branch
          # to the account's winget-pkgs fork and opens the pull request.
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Xivly_${VERSION}_x64-setup.exe"
          NOTES="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          # The versions winget-pkgs has (a 404: the package isn't there yet).
          if LISTING=$(gh api "repos/microsoft/winget-pkgs/contents/manifests/j/JulienBlanchon/Xivly" \
              --jq '.[] | select(.type == "dir") | .name' 2>&1); then
            if echo "$LISTING" | grep -qxF "$VERSION"; then
              echo "$PACKAGE $VERSION is already in winget-pkgs."
              exit 0
            fi
            # Never add a version older than the newest one (a re-run of an old tag).
            NEWEST=$(printf '%s\n%s\n' "$LISTING" "$VERSION" | sort -V | tail -1)
            if [ "$NEWEST" != "$VERSION" ]; then
              echo "winget-pkgs has $NEWEST, newer than $VERSION: left as is."
              exit 0
            fi
            # Komac carries the previous version's manifests forward and re-analyzes
            # the installer. In CI it stops (exit 0) when a pull request for this
            # version already exists, so re-runs are a no-op.
            komac update "$PACKAGE" --version "$VERSION" --urls "$URL" --release-notes-url "$NOTES" --submit
          elif echo "$LISTING" | grep -q 'HTTP 404'; then
            # First submission (a new package): manifests from scripts/winget.sh.
            # While it waits for review, later releases don't open another one.
            OPEN=$(gh api -X GET search/issues \
              -f q="repo:microsoft/winget-pkgs is:pr is:open in:title \"$PACKAGE\"" \
              --jq '.items[0].html_url // empty')
            if [ -n "$OPEN" ]; then
              echo "::notice::$PACKAGE is waiting for review in $OPEN: re-run this job once it is merged."
              exit 0
            fi
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern '*_x64-setup.exe' --dir "$RUNNER_TEMP/setup"
            SHA=$(sha256sum "$RUNNER_TEMP"/setup/*_x64-setup.exe | cut -d' ' -f1)
            ./scripts/winget.sh "$VERSION" "$SHA" "$RUNNER_TEMP/manifests"
            komac submit "$RUNNER_TEMP/manifests" --yes
          else
            echo "$LISTING"
            exit 1
          fi

  # AUR (aur.archlinux.org/packages/xivly-bin): the published .deb, repackaged
  # by makepkg. Plain git over SSH, in an Arch container for makepkg (an official
  # image of a rolling distribution: not pinned, it is upgraded first anyway).
  # The first push to a new package name creates it.
  aur:
    needs: prepare
    runs-on: ubuntu-latest
    container: archlinux:base
    # One AUR writer at a time, whatever the tag.
    concurrency:
      group: aur
      cancel-in-progress: false
    env:
      AUR: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Not set up
        if: env.AUR != 'true'
        run: echo "::notice::AUR publishing is not set up (see RELEASING.md), skipped."

      - name: Tools
        if: env.AUR == 'true'
        run: |
          pacman -Syu --noconfirm --needed git openssh
          # makepkg refuses to run as root.
          useradd --create-home builder

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.AUR == 'true'
        with:
          ref: ${{ env.TAG }}

      # From the published release, so the sha256 is the one users download.
      - name: Push xivly-bin
        if: env.AUR == 'true'
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          # The AUR account's SSH key: push access to its packages only.
          KEY="$RUNNER_TEMP/aur_key"
          (umask 077 && echo "$AUR_KEY" > "$KEY")
          export GIT_SSH_COMMAND="ssh -i $KEY -o StrictHostKeyChecking=accept-new"
          # A new package's clone is empty (git warns), which is fine.
          git clone ssh://aur@aur.archlinux.org/xivly-bin.git aur
          CURRENT=$(sed -n 's/^\tpkgver = //p' aur/.SRCINFO 2>/dev/null || true)
          CURRENT_REL=$(sed -n 's/^\tpkgrel = //p' aur/.SRCINFO 2>/dev/null || true)
          # Never move the package back to an older version (a re-run of an old tag).
          if [ -n "$CURRENT" ] && [ "$(vercmp "$CURRENT" "$VERSION")" -gt 0 ]; then
            echo "The AUR has $CURRENT, newer than $VERSION: left as is."
            exit 0
          fi

          # makepkg finds the .deb here instead of downloading it again.
          SRC=/home/builder/src && mkdir -p "$SRC"
          curl -sSfL -o "$SRC/Xivly_${VERSION}_amd64.deb" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Xivly_${VERSION}_amd64.deb"
          SHA=$(sha256sum "$SRC/Xivly_${VERSION}_amd64.deb" | cut -d' ' -f1)
          render() {
            ./scripts/aur.sh "$VERSION" "$SHA" "$1" > aur/PKGBUILD
          }
          # Same version: keep its pkgrel, unless the package changes (a rebuilt
          # release, or a fix to scripts/aur.sh), which then needs the next one.
          REL=1
          if [ "$CURRENT" = "$VERSION" ]; then
            REL=$CURRENT_REL
            render "$REL"
            if ! git -C aur diff --quiet -- PKGBUILD; then REL=$((CURRENT_REL + 1)); fi
          fi
          render "$REL"

          # Check the sources' checksums and write .SRCINFO, as the builder user.
          BUILD=/home/builder/build && mkdir -p "$BUILD"
          cp aur/PKGBUILD "$BUILD/"
          chown -R builder: /home/builder
          su builder -c "cd $BUILD && SRCDEST=$SRC makepkg --verifysource && makepkg --printsrcinfo > .SRCINFO"
          cp "$BUILD/.SRCINFO" aur/.SRCINFO

          cd aur
          git config user.name "Julien Blanchon"
          git config user.email "julien@blanchon.cc"
          git add PKGBUILD .SRCINFO
          # Re-runs of the same release are a no-op.
          git diff --cached --quiet && exit 0
          git commit -m "xivly-bin $VERSION-$REL"
          for attempt in 1 2 3; do
            git push origin HEAD:master && exit 0
            echo "Push failed (attempt $attempt), retrying."
            sleep 5
            git pull --rebase origin master || true
          done
          exit 1
