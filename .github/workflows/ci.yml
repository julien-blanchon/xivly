name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      # Unused files, exports and dependencies.
      - run: bunx knip
      - run: bun run build:web
      # End-to-end smoke test of that build (playwright.config.ts). Playwright's
      # Chromium is recent enough for pdf.js 6 (Chrome 145+).
      - run: bunx playwright install --with-deps --only-shell chromium
      - run: bunx playwright test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      # The Chrome extension: the web build, packaged (the script checks the
      # manifest and the files it names, and that no inline script is left).
      - run: bun run build:extension
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: chrome-extension
          path: dist/*_chrome.zip
          if-no-files-found: error
          retention-days: 14

  # The desktop app ships on all three: compile, lint and test the Rust side on each.
  # No frontend build: tauri::generate_context! only needs a frontendDist to
  # embed, so a stub page stands in (the web job builds the real one).
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      # One debug-profile cache per OS (saved on main, restored by pull requests).
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: ci-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Stub frontend
        run: mkdir -p build && echo '<!doctype html><title>Xivly</title>' > build/index.html
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
